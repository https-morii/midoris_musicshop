<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Midori's Music Shop - TS</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header>
    <h1>Midori's Music Shop 🎸</h1>
    <div id="cart-summary">
      <span>Carrinho: <strong id="cart-count">0</strong> itens</span>
      <span>Total: R$ <strong id="cart-total">0.00</strong></span>
    </div>
  </header>

  <main>
    <section id="products-section">
      <h2>Catálogo de Produtos</h2>
      <div id="product-list" class="grid"></div>
    </section>

    <section id="cart-section">
      <h2>Seu Carrinho</h2>
      <ul id="cart-items"></ul>
    </section>
  </main>

  <script src="app.js"></script>
</body>
</html>
