
<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Midori's Music Shop - Login e Cadastro</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body class="auth-body">
    <div class="auth-container">
        <h1>🎸 Midori's Music Shop</h1>
        <p class="auth-subtitle">Sua loja de instrumentos e equipamentos C2C</p>

        <!-- Abas de navegação (login / cadastro) -->
        <div class="auth-tabs">
            <button id="tab-login" class="auth-tab-btn active">Entrar</button>
            <button id="tab-register" class="auth-tab-btn">Cadastrar</button>
        </div>

        <!-- Mensagem de feedback -->
        <p id="auth-message" class="auth-msg"></p>

        <!-- Formulário de login -->
        <form id="form-login" class="auth-form active">
            <div class="input-group">
                <label for="login-email">E-mail</label>
                <input type="email" id="login-email" placeholder="seu@email.com" required>
            </div>
            <div class="input-group">
                <label for="login-password">Senha</label>
                <input type="password" id="login-password" placeholder="Sua senha" required>
            </div>
            <button type="submit" class="glow-btn" style="width: 100%; margin-top: 10px;">Entrar na Conta</button>
        </form>

        <!-- Formulário de cadastro -->
        <form id="form-register" class="auth-form">
            <div class="input-group">
                <label for="reg-name">Nome de Usuário</label>
                <input type="text" id="reg-name" placeholder="Seu nome" required>
            </div>
            <div class="input-group">
                <label for="reg-email">E-mail</label>
                <input type="email" id="reg-email" placeholder="seu@email.com" required>
            </div>
            <div class="input-group">
                <label for="reg-password">Senha</label>
                <input type="password" id="reg-password" placeholder="Crie uma senha" required>
            </div>
            <div class="input-group">
                <label for="reg-confirm-password">Confirmar Senha</label>
                <input type="password" id="reg-confirm-password" placeholder="Digite a senha novamente" required>
            </div>
            <div class="input-group">
                <label for="reg-role">Tipo de Conta</label>
                <select id="reg-role">
                    <option value="comprador">Comprador</option>
                    <option value="vendedor">Vendedor</option>
                </select>
            </div>
            <button type="submit" class="glow-btn" style="width: 100%; margin-top: 10px;">Criar Conta</button>
        </form>
    </div>

    <script src="app.js"></script>
</body>
</html>
