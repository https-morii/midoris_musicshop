<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Midori's Music Shop - Entrar</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body class="auth-body">
    <div class="auth-box">
        <h1>🎸 Midori's Music Shop</h1>
        <p class="subtitle">Plataforma C2C de Instrumentos Musicais</p>
        
        <div class="auth-tabs">
            <button id="tab-login" class="auth-tab-btn active">Login</button>
            <button id="tab-register" class="auth-tab-btn">Cadastro</button>
        </div>

        <!-- Formulário de Login -->
        <form id="form-login" class="auth-form active">
            <div class="input-group">
                <label for="login-email">E-mail</label>
                <input type="email" id="login-email" placeholder="seu@email.com" required>
            </div>
            <div class="input-group">
                <label for="login-password">Senha</label>
                <input type="password" id="login-password" placeholder="••••••••" required>
            </div>
            <button type="submit" class="glow-btn">Entrar na Loja</button>
        </form>

        <!-- Formulário de Cadastro -->
        <form id="form-register" class="auth-form">
            <div class="input-group">
                <label for="reg-name">Nome Completo</label>
                <input type="text" id="reg-name" placeholder="Seu nome" required>
            </div>
            <div class="input-group">
                <label for="reg-email">E-mail</label>
                <input type="email" id="reg-email" placeholder="seu@email.com" required>
            </div>
            <div class="input-group">
                <label for="reg-password">Senha</label>
                <input type="password" id="reg-password" placeholder="••••••••" required>
            </div>
            <div class="input-group">
                <label for="reg-role">Tipo de Conta</label>
                <select id="reg-role" required>
                    <option value="comprador">Comprador</option>
                    <option value="vendedor">Vendedor (Anunciar Produtos)</option>
                </select>
            </div>
            <button type="submit" class="glow-btn">Criar Conta</button>
        </form>
        <div id="auth-message" class="auth-msg"></div>
    </div>

    <script src="app.js"></script>
</body>
</html>
